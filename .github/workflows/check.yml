name: Check state
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validator
        run: pip install "jsonschema[format]==4.23.0"
      - name: Fetch the heartbeat and queue schemas from Taxiway main
        run: |
          base=https://raw.githubusercontent.com/taxiway-sh/taxiway/main/.agents/agents
          curl -fsSL -o /tmp/status.schema.json "$base/status.schema.json"
          curl -fsSL -o /tmp/queue.schema.json "$base/queue.schema.json"
      - name: Validate heartbeats, queue items and deployed.json
        run: python3 scripts/check-status.py . /tmp/status.schema.json /tmp/queue.schema.json
